name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install poppler (independent PDF parser for the ATS test)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Unit and ATS-parse tests
        run: npm test
      - name: End-to-end in Chromium (phone viewport)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          npm run e2e
